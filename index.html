<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d5d45">
  <title>Nutiva Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="auth-screen" id="authScreen" aria-live="polite">
    <div class="auth-card"><div class="brand auth-brand"><span class="brand-mark">N</span><div><strong>NUTIVA</strong><small>Manager compartido</small></div></div><h1>Ingresar al equipo</h1><p id="authMessage">Conectando con el espacio de trabajo…</p><form id="authForm" hidden><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Contraseña<input type="password" name="password" minlength="6" required autocomplete="current-password"></label><div class="auth-actions"><button class="button" name="mode" value="login">Ingresar</button><button class="button secondary" name="mode" value="signup">Crear cuenta</button></div></form></div>
  </section>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">N</span><div><strong>NUTIVA</strong><small>Manager</small></div></div>
      <nav aria-label="Módulos" id="nav">
        <button class="nav-item active" data-page="dashboard">Resumen</button>
        <button class="nav-item" data-page="products">Productos</button>
        <button class="nav-item" data-page="supplies">Insumos</button>
        <button class="nav-item" data-page="recipes">Recetas</button>
        <button class="nav-item" data-page="production">Producción</button>
        <button class="nav-item" data-page="sales">Ventas</button>
        <button class="nav-item" data-page="expenses">Gastos</button>
        <button class="nav-item" data-page="tasks">Tareas</button>
        <button class="nav-item" data-page="history">Historial</button>
        <button class="nav-item" data-page="settings">Configuración</button>
      </nav>
      <p class="storage-note">Tus datos se guardan en este dispositivo.</p>
    </aside>
    <main class="workspace">
      <header class="topbar"><button class="menu-button" id="menuButton" aria-label="Abrir menú">☰</button><div><p class="eyebrow" id="pageEyebrow">OPERACIÓN</p><h1 id="pageTitle">Dashboard</h1></div><time id="today"></time></header>
      <div id="content"></div>
    </main>
  </div>
  <script src="data.js"></script>
  <script src="app.js?v=reset-20260915"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="cloud-sync.js"></script>
  <script src="insumos-patch.js"></script>
</body>
</html>
